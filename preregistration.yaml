# A25 (set 8; R7 as registered, instantiated for the Patchscope = E5c; ~1 A100-h).
# R7's statistic on the Patchscope, fixed here: the certificate score of an activation h is k_agree = the largest
#   number of the 8 identity3 carriers that emit the SAME non-empty string (cut at the identity stops, norm()) when h
#   is patched at the pre-named cell (source L32, target t4; same-layer as a second, report-only arm); k_agree_multi =
#   the same over strings of >= 2 tokens. Background = generic wikitext records (runs/contexts/qwen3_T128_256.pt): 96
#   records x 24 seeded positions from the valid window = 2,304 activations (R7: >= 2,000 from >= 64 records); the
#   records are split in half by RECORD (seeded): calibration -> tau_q = split-conformal quantile (sjlens.lens.score
#   .conformal_threshold) for q = .05 and .01; test -> FPR_q = P(k_agree > tau_q); N_eff = 48 test records.
#   Script scripts/e5c_certificate.py (generation batched over activations; pinned to x3.patched_generate).
# PASS (R7 as registered): |FPR_q - q| <= 2 sqrt(q (1 - q) / N_eff) at q = .05 and .01 for k_agree at t4. Because the
#   score is discrete (0..8) the conformal threshold can only be conservative: an FPR BELOW q - 2 se is recorded as
#   "conservative (valid, loose)" and does not count as a miss; the registered miss is FPR > q + 2 se (the certificate
#   over-promises). KILL: none (R7: "a miss means the split is fixed, not the hypothesis").
# Report-only (the item side, offline from the stored w3_B_x3i3_14b_ans_L32 / w3_A_x3i3_14b_ans_L32 rows, and later
#   from the fresh runs): coverage = P(k_agree > tau_q), certified-correct = P(k_agree > tau_q and exact majority),
#   certified-wrong = P(k_agree > tau_q and not exact), for the real rows and every control; the paper's sentence is
#   "of the items the reader gets right, X % carry a certificate whose background false-alarm rate is <= 5 %".

# A26 (29 Sep 2026, 22:10; written BEFORE the run; approved by the user): neutral-context control for the A22 pass.
# Problem (LOG 21:40): the continuation carrier at the first-hop token reads the bridge for 26/30 track-B items (bench
#   rule any-of-8), but the outputs are "... is the capital of Saudi Arabia" from h at "Riyadh". The carrier's forward
#   pass may RE-DERIVE the country from the entity's identity ("entity-then-recompute"). If so, this is not evidence
#   that the SOURCE model computed the bridge at that position.
# Control: the same 30 first-hop entities, each placed in two NEUTRAL sentences that name the entity but ask nothing
#   about its country (data/a26_neutral_items.json, 60 items, template n1 "Fact: Yesterday someone mentioned <E> is",
#   n2 "Fact: My notes from the trip include <E> is"). Same bridge string, same first-hop locator (60/60 located, checked
#   with the Qwen3-14B tokenizer), same reader: x3_patchscope.py, 14B, L32, target 4, carriers continuation + identity3,
#   position firsthop, 8 carriers, greedy 8, controls shuffled + random; bench-rule any-of-8 via e5a offline.
# Statistic: bench-rule any-of-8 for the continuation carrier; neutral rate = mean over the two templates; paired by
#   entity against the A22 two-hop rate on the same 30 items (w5_br_14b_B_fh, .867).
# Pre-registered reading:
#   ENTITY-RECOMPUTE: neutral >= two-hop - .10 -> the A22 pass is explained by entity identity + recompute in the
#     carrier; the paper reports A22 as "the first-hop state carries the entity", NOT as bridge reading.
#   BRIDGE-BEYOND-ENTITY: two-hop - neutral >= .20 with the paired item-bootstrap 95% CI of the difference excluding 0,
#     for BOTH templates -> the two-hop context adds bridge information at the first-hop position; A22 stands as bridge
#     reading.
#   Anything else: unresolved; reported with both numbers. identity3 numbers are report-only. Controls must stay <= .05.
