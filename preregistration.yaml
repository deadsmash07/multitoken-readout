# A21 (set 4; placeholder-contamination test, Patchscopes App. C; ~5 A100-h; MECHANISM TEST, report-only, no pass / kill).
# Hypothesis H_contam: the same-layer vs early-target gap (track B identity3 L32: same .206 vs t4 .469) comes from the
#   carrier's placeholder token "?" whose representation persists at the patch position in the blocks below the target
#   and is attended to during generation; H_comp: it comes from the extra computation (blocks t+1..32) the patched
#   state receives before the read.
# Code (x3_patchscope.py): --target-layer all<k> = h WRITTEN at the patch position at the embedding and after EVERY
#   block 0..k (qwen3_min.forward inject_set: overwrite, not add), so no representation of "?" exists there at any
#   depth <= k; blocks above k run clean. --placeholder <s> swaps the final "?" of the identity carriers for another
#   single token (arm suffix :ph=<s>). Arms on track B held-out (175 gated of 305), Qwen3-14B, source L32, 8 carriers,
#   greedy 8, controls shuffled + random (crosscat adds nothing to an exact-match control, A10):
#   (a) t4 single patch       (existing: w3_B_x3i3_14b_ans_L32 / w3c controls)   identity3 .469 majority
#   (b) all4                  h at embedding + blocks 0..4, then clean 5..40      NEW  w5_ph_14b_B_i3
#   (c) all32                 h at embedding + blocks 0..32, then clean 33..40    NEW  (same line)
#   (d) same-layer single     (existing)                                          identity3 .206
#   (e) same-layer and t4 with placeholder "x" instead of "?"                     NEW  w5_ph_14b_B_i3_swap
#   (a')-(c') the same with the continuation carrier (no placeholder: its last token is a real word)  NEW w5_ph_14b_B_cont
# Statistics: identity3 = majority exact (registered R3 rule) and bench-rule any-of-8 (e5a offline); continuation =
#   bench-rule any-of-8 and prefix majority (e5a). Paired differences with item-level bootstrap CIs on the same 175 items.
# PRE-NAMED reading (on identity3 majority exact, the registered statistic):
#   if |(c) - (a)| <= .05 and (c) - (d) >= .15 -> H_contam: removing the placeholder alone recovers the early-target gain;
#   if |(c) - (d)| <= .05 and (a) - (c) >= .15 -> H_comp: with no placeholder but no extra computation the gap remains;
#   (b) vs (a): |(b) - (a)| <= .05 says the placeholder representation in blocks 0..4 does not matter for the t4 arm;
#   (e): a change of > .05 at same-layer under the swap says the placeholder identity matters there (contamination is
#        real at same-layer even if not the cause of the gap);
#   anything else (both, neither, mixed) is reported as unresolved. The continuation carrier repeats the reading with
#   its own numbers (it has no placeholder, so H_contam predicts (c') ~ (d') there). No headline changes; the paper
#   reports the four (five) arms as a mechanism table with the prior-work citation.

# A22 (set 5; bridge reading at the first-hop position; ~8 A100-h).
# Hypothesis: a prompt-blind carrier verbalises the latent bridge where it is REPRESENTED (the first-hop entity's last
#   token and its neighbours), not where it is merely used (the final token, where R5 KILLED it at <= .028 majority).
# Code: x3_patchscope.py --positions firsthop-1 / firsthop+1 beside firsthop (controls at the partner's own first-hop +-
#   k token, the A14 rule; items without a first-hop position skipped and counted); the continuation carrier is a
#   --carriers kind at any position. x8_wsbench_items.py --x3-positions all (+ --x3-pos-max K): every one of the last K
#   prompt positions is read (arms _off<k>, controls at the partner's same offset from ITS end, clipped), and
#   results.json["families"][f]["position_profile"] gives the per-offset bridge1 / target unit rates and the
#   per-item any-position union (a SELECTION, labelled). The bench's bridge clause is not located per item (its
#   end is not marked in the bank and a heuristic locator would be a post hoc choice); the scan replaces it.
# Runs (Qwen3-14B):
#   (i)  w5_br_14b_B_fh: our track-B bridge items (143 gated, 30 with a first-hop position), positions last / firsthop /
#        firsthop-1 / firsthop+1, carriers identity3 + continuation, L32 t4 (t8 = optional sensitivity line), 8 carriers,
#        greedy 8, controls shuffled + random. Scored by the exact rule (majority; identity3) and the bench rule (any-of-8;
#        both carriers, e5a offline).
#   (ii) w5_br_14b_mh_scan: bench multihop_mt gated set (66), x3c with the two answer-frame carriers only (indices 4, 5
#        of x3.CONTINUATION; --x3-carrier-ids), L32 t4, the last 40 prompt positions, shuffled control, bridge1 / bridge2 /
#        target units under the bench regex per offset.
# PRE-NAMED cells: (i) identity3 and continuation at `firsthop`, L32 t4; (ii) x3c t4 L32, statistic = the MAXIMUM over
#   offsets of the per-offset bridge1 unit rate (the same maximum is taken for the shuffled control, so the selection
#   is applied to the null too).
# PASS: (i) track-B first-hop majority exact >= .30 (R5's line) with shuffled / random <= .05, OR bench-rule any-of-8
#   >= .30 with controls <= .05 (either carrier; the two carriers are two arms, declared per arm; +-1 positions are
#   sensitivity); or (ii) max-over-offsets bridge1 rate >= .20 on the 66 with the shuffled maximum <= .05.
# KILL: (i) <= .05 at firsthop and firsthop+-1 for both carriers under both rules AND (ii) max-over-offsets bridge1
#   <= .05 -> the bridge is not verbalisable by a prompt-blind carrier at either position on this model; the paper's
#   two-position negative. Between the lines: reported as a lead with the per-position profile. Multiplicity: the
#   per-arm declaration (2 carriers x 2 rules for (i), 1 statistic for (ii)); Holm over the 4 (i)-tests at alpha .05.
#   The E5a lead (.133 any-of-8 at first-hop t4, 4 / 30) is the number this replaces; it is not a prior for the line.

