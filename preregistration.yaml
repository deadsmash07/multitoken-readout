# Pre-registration of the reformulated hypotheses R0-R8 (sjlens), written before any Day-1 job is launched.
#
# Source: docs/REFORMULATION_AND_PLAN.md table 3.4 (hypotheses, statistics, nulls, pass / kill) and section 6
# (designs, layers, sizes, day plan). Nothing below may be changed after the first held-out job runs; changes are
# appended as dated amendments at the end of this file with the reason.
#
# Two rules that bind every entry:
#   items:  headline numbers are computed on the HELD-OUT half of data/h2a_split.json (434 answer ids). Any choice
#           (alpha, carrier frame, layer for a "best layer" claim, vote rule, normaliser) is made on the TUNING half
#           (433 ids) or fixed a priori in this file. Bridge items are not in the split (they are not answer items);
#           bridge numbers are reported on all gated bridges and are descriptive, never a pass/kill on their own.
#   stats:  every rate is reported with a 1,000-resample item-level bootstrap 95 % CI. Where several layers are
#           tested for one hypothesis, the pass claim uses Holm across layers at family alpha = 0.05.

meta:
  written: 2026-09-25, before the Day-1 jobs
  items_file: data/h2a_items.json          # 1198 items: 867 answer, 331 bridge
  split_file: data/h2a_split.json          # seed 0, 433 tuning / 434 heldout answer ids
  contexts: runs/contexts/qwen3_T128_256.pt # 256 generic carriers + 256 background records, T = 128
  models:
    - Qwen/Qwen3-1.7B   # 28 blocks; depth marks L11 / L17 / L22 = 39 / 61 / 79 %
    - Qwen/Qwen3-14B    # 40 blocks; depth marks L16 / L24 / L32 = 40 / 60 / 80 %
  dtype: bf16-mixed on 14B (bf16 weights, fp32 activations; G2 measured mixed = fp32 exactly for Qwen3), fp32 on 1.7B
  gating:
    answer: greedy continuation reproduces item["pieces"] exactly
    bridge: a tokenisation of the target is a greedy prefix, or is contained TOKEN-WISE in the first 6 greedy tokens
            (patch P1: no substring matches), AND the item is not a bridge_leak
    bridge_leak: the greedy output contains the bridge string, or the target starts with the bridge's first piece;
                 these items are excluded from bridge headline numbers and reported as a separate count
  min_p1_chars: 0 by default; the 1-character-first-piece subset (360 items, audit A13) is reported separately
  bootstrap: 1000 item-level resamples, percentile 95 % CI
  multiplicity: Holm across layers within a hypothesis

# ---------------------------------------------------------------------------------------------------------------
R1:
  name: locality (is s2 recoverable from h placed at gap 1?)
  script: scripts/x1_gap1_patch.py
  day: 1 (1.7B), 2 (14B)
  items: gated ANSWER items, held-out half; tuning half only for smoke / timing
  statistic: |
    For item i with first two pieces (s1, s2) and h = residual at the last prompt token at layer l:
    patch h into each of n_ctx generic carriers at the carrier's LAST context position (index tau-1, i.e. gap 1 to
    the position that predicts s2), append s1, and read log p(. | c, s1) at the s1 position through the true head
    log_softmax(lm_head(norm(h_L))). Delta log p(w) = patched - clean, averaged over carriers. Report the rank of s2
    over the full vocabulary (top-1, top-10, median) and the mean Delta log p(s2).
  layers: 1.7B 14, 18, 22, 26; 14B 16, 24, 32, 36
  alphas: [0.3, 1.0]   # add mode; scale = alpha * (mean carrier source-residual norm) / ||h||, i.e. ||delta|| = alpha * mean||h_t||
  modes: [add, replace]  # replace overwrites the carrier residual at tau-1 with h (no scale choice)
  carriers: 64 contexts from runs/contexts/qwen3_T128_256.pt, chunked; frames: plain (default) and answer
            ("... The answer is" before s1), the second is a pre-declared secondary arm, not a tuning knob
  vote_rule: none (the statistic is the mean Delta log p over carriers, then one rank per item)
  controls:
    shuffled_h: h of another gated item of the SAME category, derangement with fixed seed 0
    random_dir: Gaussian direction, norm-matched to ||h||, seed 0
  reference_arm: far-gap G8 statistic on the same items (sources 16..tau-2), for continuity with the kill of H2a
  pass: s2 top-10 >= 0.30 at some layer AND both controls <= 0.05 at that layer (Holm across the 4 layers)
  kill: s2 top-10 <= 0.05 at every layer and within 2 points of the controls, on BOTH models
  reported_anyway: per-category tables, mean Delta log p(s2), the rank of s1 in the lens readout D h per item
                   (kappa / precondition bookkeeping), p1_chars

R2:
  name: linearity at the right gap (does the tangent suffice?)
  script: scripts/x1_gap1_patch.py (linear arm)
  day: 1
  items: same as R1 (held-out half)
  statistic: |
    Exact JVP of the same readout with a one-position mask at tau-1 and prefix [s1]
    (lens/forward.py jvp_exact / jvp_step with mode "lp" for log-probs, "z" for pseudo-logits; patch P4's jvp_gap).
    Rank of s2 over the vocabulary, same reporting as R1.
  decision_rule: "linear suffices" iff JVP s2 top-10 >= 0.8 x the finite-alpha (alpha = 1, add) top-10 at the same layer
  null: beta(alpha) = R_alpha / (alpha R'_0) = 1
  pass: decision, not a pass/kill; report beta(alpha) per item where the finite arm is non-degenerate
  kill: none

R3:
  name: verbalisation by the model's own decoder (patchscope)
  script: scripts/x3_patchscope.py
  day: 1 (1.7B), 3 (14B)
  items: gated ANSWER items (held-out half) for the headline; gated bridges reported separately
  statistic: |
    Patch h into a fixed carrier prompt at the patch position (replace, and optionally norm-matched add), greedy-decode
    6 tokens, cut the generation at the carrier's stop marker, and exact-string match against the item's string after
    normalisation (strip, collapse internal whitespace, casefold; cut() and norm() in the script). Majority vote
    across carriers: an item counts as recovered iff more than half of the carriers of that kind emit the string.
  stop_markers:   # fixed a priori. Without them the identity carrier's own format ("<x> -> <x>; ...") would make the
    identity: [";", "->", "\n"]   # exact match fail even on a perfect verbalisation, i.e. R3 would fail vacuously.
    describe: [".", ";", "\n"]
  secondary: prefix match (the raw generation starts with the string) and first-piece match, both on the UNCUT
             generation, are reported beside the exact number and are not subject to the pass / kill line
  carriers:
    identity: "cat -> cat; 1135 -> 1135; hello -> hello; ?" with the patch at the "?" token
    describe: "Syria: Country in the Middle East. Leonardo DiCaprio: American actor. Samsung: South Korean
               multinational corporation. x:" with the patch at x
    n_carriers: 8 per kind, fixed variant list in the script (different few-shot examples), never tuned on items
  target_layer: the same layer as the source by default; --target-layer is an explicitly reported variant
  layers: 1.7B 10, 14, 18, 22, 25, 27; 14B 12, 16, 24, 32, 36, 38
  positions: answers at the last prompt token; bridges also with --positions all (every prompt position), reporting
             the best position per item AND the per-position profile (the best-position number is a selection and is
             labelled as such)
  controls: shuffled h within category (expected ~0), norm-matched random direction
  pass: answers exact-string recall >= 0.30 at the best layer with both controls <= 0.05
  kill: < 0.05 at every layer on BOTH models
  reported_anyway: per layer / carrier kind / category; prefix-match and first-piece-match rates as secondary

R4:
  name: concept vs bag (do phrase vectors add anything over a bag of piece rows?)
  script: scripts/e14_dictionary.py (patch P2), probe arm X4 on days 2-3
  day: 2-3 (Day 1 only fixes the statistic and the controls)
  items: gated queries; answer queries restricted to the held-out half for the headline (--split heldout)
  statistic: within-first-piece-family top-1, digit / year / number categories excluded, for hybrid_nm vs mean_lens
             (bag) vs pure vs first_lens; chance = mean 1 / family size
  controls: shuffled-h within category (permuted queries, derangement, seed 0), norm-matched random direction
  pass: hybrid_nm >= mean_lens + 0.05 on the held-out within-family statistic (else: drop phrase vectors, keep the bag)
  kill: none
  note: the all-candidate top-1 is reported but is mostly first-piece identification (C2); the unique-first-piece
        subset is reported separately to make that explicit

R5:
  name: disposition ceiling for latent content (where are bridges readable?)
  script: scripts/x3_patchscope.py --kinds bridge --positions all; scripts/e14_dictionary.py
  day: 1 (1.7B scan), 3 (14B)
  items: gated bridge items (all; not in the answer split), by category
  statistic: bridge top-1 of the dictionary vs the first-piece row vs the patchscope at the last token and at the
             best / profiled source positions, by category and model size
  pass: patchscope at non-last (first-hop) positions beats the last-token dictionary by >= 0.15 on PERSON bridges at 14B
  kill: none (this is a decision about where to read)

R6:
  name: sensitivity is not binding
  statistic: Spearman between per-item kappa(s1) (or, on Day 1, the cheap proxy logged by X1: the rank of s1 in D h
             and the per-item Delta log p) and the R1 s2 rank
  null: 0
  pass: report only
  kill: none

R7:
  name: phrase-level certificate
  day: 3 (X7)
  statistic: empirical FPR of the split-conformal threshold on the dictionary's max-z and on the patchscope's
             R_alpha-z at q = 0.05 / 0.01, on >= 2,000 background activations from >= 64 records
  pass: within q +- 2 sqrt(q (1-q) / N_eff) with N_eff = number of RECORDS (not activations)
  kill: none (a miss means the split is fixed, not the hypothesis)

R0:
  name: gap decomposition at scale
  script: scripts/phase_a_local.py --do E7 (+ scripts/e7b_gap0_alignment.py --tokens)
  day: 1 (14B L16, L24), 2 (L32, L36)
  statistic: ||G_g|| profile, rho_frob and rho_exact, the norm-weighted future sum S = sum_{g>=1} (1 - g/|T|) ||G_g||
             and the gap-1 / gaps 1-5 / gaps >= 20 shares of it (C16); per-token gap-0 share and cos(gap-0, rest) for
             50 words + 50 fragments at 40 / 60 / 80 % depth
  pass: descriptive, report only
  kill: none

R8:
  name: J-lens characterisation
  statistic: as R0 / G10 on 1.7B, 14B and one non-Qwen released lens; gap 1 share of the future term; the Bonferroni
             FPR against the conformal one
  claims_to_check: J-lens = logit lens + a long-range future term; gap 1 < 20 % of the future term;
                   Bonferroni FPR >= 5x nominal
  pass: report only
  kill: none

# ---------------------------------------------------------------------------------------------------------------
day1_scope:
  # What Day 1 actually decides. Everything else above is registered so that later days cannot re-choose it.
  - R1 and R2 on Qwen3-1.7B at L14 / L18 / L22 / L26 (held-out half, 64 carriers, alphas 0.3 and 1, add and replace)
  - R3 on Qwen3-1.7B (answers; bridges with the position scan) at layers 10, 14, 18, 22, 25, 27
  - R0 / R8 on Qwen3-14B: the E7 gap profile at L16 and L24 in bf16-mixed
  decision_after_day2: R1 or R3 passes on either model -> the dial paper; both kill on both models -> the analysis paper

# Amendments after the Day-1 results (25 Sep 2026, docs/ANALYSIS_DAY1.md). Each entry names what changed, why, and
# whether it touches a pass / kill line. The original entries above are untouched; the R1 / R3 verdicts stay as
# registered and the new lines are labelled SECONDARY or descriptive. Free parameters of the new arms (target layer,
# carrier variants) are fixed here or chosen on the TUNING half; headline numbers stay on the HELD-OUT half.
amendments:
  - id: A1
    date: "2026-09-25 (, before any wave-2 job)"
    what: |
      shuffled-h control = within-category derangement that never pairs an item with itself or with an item of
      the SAME string; items without a valid partner (singleton categories, duplicate-only strings) are dropped
      from the control comparison and their count is reported (n_shuffled_dropped). Seeded per (seed, category).
    why: |
      ANALYSIS_DAY1 C1 - 5 of 278 Day-1 partners were the item itself or the same string (control inflated <= 1.8 pts).
    affects: |
      R1, R3, R4 controls (scripts/e12_second_token.py shuffled_perm, used by x1 / x3 / e14 / x4). No line changes.
  - id: A2
    date: "2026-09-25"
    what: |
      a third control, crosscat = h of a gated item of a DIFFERENT category (cross-category derangement, seeded,
      never the same string), run through every arm beside shuffled and random.
    why: |
      ANALYSIS_DAY1 section 2 - the same-category control absorbs the s1 x category prior (the correct null for the
      item-level claim); the cross-category control is the null for "h carries the category" and separates the two
      levels in one table. Reported beside the registered controls; the R1 / R3 pass clauses keep "both controls
      <= 0.05" over the registered pair (shuffled, random); crosscat is reported, not part of the pass test.
    affects: |
      X1, X3, E14, X4 (control column). No line changes.
  - id: A3
    date: "2026-09-25"
    what: |
      X1 logs three rank statistics per row - rank_s2 (rank of s2 in Delta log p, the registered readout statistic),
      rank_s2_abs (rank of s2 in the PATCHED mean log-prob: does the model now predict s2?), rank_s2_clean (rank of
      s2 in the clean carrier + s1 distribution, no patch; the s1-only baseline; identical across arms) with
      logp_s2_patched / logp_s2_clean; summaries give top-1 / top-10 / median with bootstrap CIs for all three, and
      paired real-minus-control differences (top-10, top-1; Delta-rank and absolute rank) with paired item-level
      bootstrap CIs and exact McNemar counts.
    why: |
      ANALYSIS_DAY1 C6 - "recovers s2" needs the absolute and clean ranks; they are forward-only, one line each.
    affects: |
      R1 reporting. The registered R1 statistic (rank_s2) and verdict are unchanged.
  - id: A4
    date: "2026-09-25"
    what: |
      X1 target-layer patching (N1): h read at the source layer l is patched into the carrier AFTER block l'
      (l' in {same, 4, 8, 12, 16} on 1.7B), still at position tau-1, modes replace and replace_nm (h rescaled to
      the mean carrier residual norm at l'); arms keyed ":t<l'>". Sources 18 / 22 / 26 (1.7B). The two best
      (source, target) cells, chosen on the 1.7B HELD-OUT grid, are then run on 14B (N3 placeholder in
      jobs/wave2.txt) and labelled as a selection. Third-piece arm (":p3"): s3 given s1 s2, items with >= 3 pieces.
    lines: |
      N1 (proposed in ANALYSIS_DAY1 section 5, SECONDARY): pass if some cell has real top-10 >= 0.50 and
      real - same-category >= 0.25 with the paired CI lower bound >= 0.15 (Holm over the 15 cells); kill if no cell
      improves real - same-category by >= 0.05 over the same-layer cell. Does not replace R1.
    why: |
      ANALYSIS_DAY1 C3 - same-layer patching lets the s1 position read h only through blocks l+1..L (2 at L26).
  - id: A5
    date: "2026-09-25"
    what: |
      X3 v2 carriers (fixed lists in scripts/x3_patchscope.py, never tuned on items): identity2 (8 variants with
      MULTI-token exemplars, e.g. "Kuala Lumpur -> Kuala Lumpur; hippopotamus -> hippopotamus; 1945 -> 1945; ?",
      patch at "?", stops ";" "->" newline) and describe2 (8 variants "Syria -> Syria is a country in the Middle
      East. ... ? ->", patch at the "?" ENTITY SLOT which is not the last token, stops " is " " was " " ->" ";" "."
      newline; checked on CPU with the real 1.7B: a literal entity in the slot gives "<entity> is <description>"
      for all 8 variants). --gen 8; target layers {same, 2, 4, 8}; positions: answers at the last token; bridges at
      the last token and at the FIRST-HOP entity's last token (e12.firsthop_pos: the token before the template tail
      " is" / " is the" / " was"; curated templates only, others skipped and counted). Day-1 carriers unchanged.
      C2 fix: the first-piece flag is token-level (first generated token, skipping a leading whitespace token,
      equals s1's token id) and the headline first-piece number is restricted to p1_chars >= 2 (vote_first_p1ge2);
      the raw rate is still reported.
    lines: |
      R3 unchanged (exact majority >= 0.30 at the best layer with both registered controls <= 0.05; kill < 0.05
      at every layer on both models), now over the v2 carriers as well; any-carrier and per-piece-count tables
      secondary. R5 unchanged (first-hop patchscope beats the last-token dictionary by >= 0.15 on person bridges
      at 14B), now testable with describe2 at the first-hop position.
    why: |
      ANALYSIS_DAY1 C4 / C5 / C8 (describe carrier dead by design, single-word exemplars, identity copy at mid-prompt positions).
  - id: A6
    date: "2026-09-25"
    what: |
      SECONDARY effect-size line for R1 (labelled secondary in every summary; the registered R1 verdict is kept
      beside it): real minus same-category shuffled top-10 >= 0.20 with the 95 % paired bootstrap lower bound
      >= 0.10 at some layer (Holm across layers), and real minus random >= 0.30.
    why: |
      ANALYSIS_DAY1 section 3 - the registered pass clause ("both controls <= 0.05") cannot be met by a
         same-category control on this item set (51 % of items have an s1 that fixes s2). On Day-1 data the line is met
         at L22 only (L18 lower bound 0.068); wave 2 re-tests it with the fixed derangement.
  - id: A7
    date: "2026-09-25"
    what: |
      X4 probe ceiling (scripts/x4_probe.py): multinomial logistic regression (torch, L-BFGS, L2 chosen by 5-fold CV
      on the tuning half) from h at the last prompt token to (a) the s2 token over the observed s2 vocabulary and
      (b) the full string (within-first-piece-family top-1 as in E14), trained on TUNING, evaluated on HELD-OUT;
      (c) bridges: h -> bridge string among bridge strings, 5-fold CV by item (bridges are not in the split), at the
      last token and the first-hop position. Control: shuffled training labels (same L2). Layers 1.7B 10 / 14 / 18 /
      22 / 26, 14B 16 / 24 / 32 / 36.
    lines: |
      pass if held-out (a) top-10 >= 0.30 with the shuffled-label control <= 0.05 at some layer (Holm). Decision:
      probe >> linear JVP (0.094 at L22) means the reader was the limit; probe ~ JVP means the representation is
      non-linear. No kill.
  - id: A8
    date: "2026-09-25"
    what: |
      item sets. (1) data/single_items.json + single_split.json (make_h2a_items.py --single): the 1-token strings of
      the same curated templates (the Anthropic source directory is not available locally, so curated only);
      answer gating = greedy first token equals the token; descriptive only - X3 identity2, E14, X4 (bridges) and
      the plain J-lens / logit-lens top-k readout (scripts/x5_reader_topk.py) calibrate each reader per category.
      (2) data/phrase_items.json + phrase_split.json (--phrases, track B): strings whose every piece is a whole word
      token (609 answer / 218 bridge candidates before gating; ambiguous first words New / South / North / San /
      United / West ..., people as first + last name, chemistry names, events, landmarks, US states, cities, teams,
      companies, common compounds; `shared_s1_group` = the first word). Track A = data/h2a_items.json (sub-word
      multi-token) and track B are reported side by side for every reader on both models (jobs/wave2.txt tags
      w2A_* / w2B_*; every results.json carries "track").
    lines: |
      the registered R1 / R3 / R4 lines apply to track B exactly as to track A (held-out half of phrase_split.json);
      the single-token set has no pass / kill. The J-lens "bag" baseline on track B (both words in the plain lens
      top-10, and their order) is descriptive.
  - id: A9
    date: "2026-09-25"
    what: |
      N6 bridge readers at the first-hop position: E14 (--positions last,firsthop; mean-of-rows / hybrid / pure /
      first-piece rows at the first-hop entity's last token, same controls), X4 (c) at the first-hop position, X3
      describe2 at the first-hop position (A5). Person and country bridges reported separately.
    lines: |
      R5 as registered (+0.15 over the last-token dictionary on person bridges at 14B); everything else descriptive.

# A10 (2026-09-26, after wave-2 partial results; reason: docs/ANALYSIS_WAVE2.md W5/W6 and walltime)
# - X3 v2 on 14B trimmed: carriers identity2 only (describe2 is inert: generations identical for real / shuffled /
#   random h, W5); targets same,4; modes replace,replace_nm; controls shuffled,random (crosscat adds nothing to an
#   exact-match control); layers 32 / 36 / 38 (L24 reads nothing on any instrument). Tags w2t_*. R3 lines unchanged.
# - describe2 results in b04 / b05 (1.7B) are reported but labelled "reader inert" and excluded from R3 / R5 verdicts.
# - X1 v2 grid (N1): replace_nm cells whose real top-10 < same-layer random + .05 are excluded from the Holm family (W6).
# - X4 class probes (A7) retired as invalid (W1 leak in bridge folds; W2 class-sparse ceiling); to be replaced by a
#   vocabulary-space probe with entity-grouped splits (to be registered as A11 before it runs).

# A11 (2026-09-26, BEFORE any P2 / P3 / P6 job; reason: docs/ANALYSIS_WAVE2.md section 6 P2 / P3 / P6, A10's
# retirement of the X4 class probes, and the user's requirement that every new reader is compared with the ORIGINAL
# released J-lens and the logit lens on the same items with the same scoring, and eventually on WorkspaceBench's own
# items with its own regex scorer. Every internal variant (mean_lens bag, hybrid phrase vectors, our chain baselines)
# is a diagnostic, never "the baseline".)
#
# P2  vocabulary-space probes (scripts/x6_future_probe.py; jobs/p2p3.txt p2_*)
#   (i) Future-Lens-style ridge map A_k: h_t^(l) -> the final-layer residual at t + k - 1 (its logits predict token
#       t + k), k = 1 (reference, beside the plain logit lens), 2 (s2 from h at the last prompt token, s1 NOT given),
#       3 (s3). Trained on generic wikitext records only (runs/contexts/qwen3_T128_256.pt + qwen3_T128_B.pt, ctx + bg,
#       ~89k pairs per layer); lambda per (l, k) by held-out-record NLL over {1e-3..10} x mean diag(S_xx). Never on items.
#       Items: gated HELD-OUT answers (tracks A, B) / all gated answers (S). Statistic: rank of s2 over the full
#       vocabulary through the model's own norm + lm_head; top-1 / top-10 / median with item-level bootstrap CIs;
#       the chained pair (s1 top-1 by the logit lens AND s2 top-1 by the k = 2 probe) beside it.
#       Controls through the same probe: shuffled-h (A1), crosscat (A2), norm-matched random. Baselines on the same
#       items: rank of s2 in the ORIGINAL released J-lens (bench cosine readout AND raw D h) and in the logit lens.
#       Layers 1.7B 14 / 18 / 22 / 26; 14B 24 / 32 / 36.
#       pass: held-out s2 top-10 >= 0.30 with both shuffled controls (same-cat, crosscat) <= 0.10 at some layer, Holm
#             across layers; kill: s2 top-10 <= the logit lens's s2 top-10 + 0.05 at every layer (report the J-lens too).
#   (ii) entity-grouped bridge probe: target = the bridge string's FIRST token through the same vocabulary readout, from
#       h at the first-hop entity's last token (e12.firsthop_pos) and, separately, at the last prompt token; A initialised
#       at the layer's k = 1 wikitext probe, fine-tuned by cross-entropy through the frozen head with lambda_b ||A - A0||^2
#       (Adam, 200 steps), lambda_b by an inner GROUPED 4-fold CV; K = 5 folds grouped by union-find over (bridge string,
#       first-hop token text) so no entity or first-hop token sits in both train and test (the W1 leak). Control:
#       permuted training labels. Baselines at the same position: logit lens and J-lens rank of the bridge's first token.
#       pass: PERSON-bridge top-10 >= 0.30 at the first-hop position at some layer (entity-grouped); kill: <= 0.05 on
#             both models. Country / element bridges descriptive (lexical capital -> country shortcuts, N6 caveat).
#
# P3  unconditional chain reader, WorkspaceBench-style (scripts/x7_chain_reader.py; jobs/p2p3.txt p3_* / p3s_*)
#   Input: activations at the item's last prompt token only - h_read at the read layer l and h_first at the first layer.
#   PRIMARY reader (a two-vector reader, declared as such): first-piece candidates = top-5 of the LOGIT LENS at the
#   deepest layer (1.7B 26, 14B 38), continuation by the gap-1 boost (X1 finite replace, 64 / 32 carriers) at read
#   layers {18, 22, 26} / {32, 36}; SECONDARY, bench-faithful single-vector reader: first piece = the released J-lens
#   (bench cosine readout) at the SAME layer as the boost. Beam width 5, <= 4 pieces, beam score = the SUM of the
#   per-step boosts Delta log p (nats), a prefix whose last boost is < 0 is never extended, tokens restricted to the
#   allowed vocabulary (no specials / whitespace-only / newline / pure punctuation except - ' . / &). No space-initial
#   stop (word phrases and the bench's targets are multi-word). Samples: N = 10 = the first reader's top-1 token +
#   the nine highest-score prefix strings; N = 1 = the highest-score prefix whose every step boost >= tau, else the
#   first reader's top-1 token; tau is chosen ONCE on the TUNING half (p3_tune*: argmax exact N = 1 over the grid
#   0..6 by 0.25 at L22 / L32, real condition) and applied to the held-out runs; 14B uses the 1.7B tau of its track
#   unless p3_tuneA_14b is run. Scoring: exact string after the bench's fold (NFKD, no combining marks, casefold,
#   whitespace collapsed) per layer and ANY layer over the run layers. Controls: shuffled-h (A1) and crosscat (A2)
#   through the whole reader (both vectors from the partner). Split by "s1 fixes s2" (clean carrier + true s1 puts s2 at
#   rank 1) and clean rank <= 10; the teacher-forced X1 row (boost of s2 given the true s1) is logged as continuity.
#   Baselines in the SAME row format, on the same items, layers and scoring, the ORIGINAL J-lens first:
#     jlens_bag10 = the bench's J-lens arm (released lens, cosine readout, 10 tokens = 10 samples; can pass only
